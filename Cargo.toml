[workspace]
members = [
    "crates/agora-client",
    "crates/agora-common",
    "crates/agora-server",
    "crates/agora-update-sign",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
agora-common = { path = "crates/agora-common" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
dioxus = { version = "0.6", features = ["desktop"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize"] }
futures-util = "0.3"
hmac = "0.12"
keyring = { version = "4", default-features = false, features = ["v1", "windows-native-keyring-store"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "migrate", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webbrowser = "0.8"
global-hotkey = "0.5"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
jsonwebtoken = { version = "10.2", default-features = false, features = ["rust_crypto"] }
winresource = "0.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = 0
